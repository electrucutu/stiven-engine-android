name: Build Stiven Engine APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Acomodar archivos del proyecto
        run: |
          if [ ! -f "Project.xml" ] && [ ! -f "project.xml" ]; then
            echo "Buscando Project.xml en subcarpetas..."
            XML_PATH=$(find . -maxdepth 3 -iname "project.xml" | head -n 1)
            if [ -n "$XML_PATH" ]; then
              DIR=$(dirname "$XML_PATH")
              echo "Moviendo archivos desde $DIR a la raíz..."
              cp -r "$DIR"/* . 2>/dev/null || true
              cp -r "$DIR"/.* . 2>/dev/null || true
            fi
          fi
          ls -la

      - name: Instalar NekoVM, Haxe y Herramientas C++
        run: |
          sudo apt-get update
          sudo apt-get install -y neko libneko2 build-essential gcc-multilib g++-multilib
          wget -q https://github.com/HaxeFoundation/haxe/releases/download/4.3.3/haxe-4.3.3-linux64.tar.gz
          mkdir haxe-dist
          tar -xzf haxe-4.3.3-linux64.tar.gz -C haxe-dist --strip-components=1
          sudo cp -r haxe-dist/* /usr/local/bin/
          sudo chmod +x /usr/local/bin/haxe /usr/local/bin/haxelib
          haxe -version

      - name: Configurar Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Instalar Librerías Haxe
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.0.1 --never
          haxelib run lime setup -y
          haxelib install openfl 9.2.1 --never
          haxelib install flixel 5.5.0 --never
          haxelib install flixel-addons 3.3.2 --never
          haxelib install flixel-ui 2.5.0 --never
          haxelib install hscript-iris 1.1.3 --never || true
          haxelib install tjson 1.4.0 --never || true
          haxelib install grig.audio --never || true
          haxelib install funkin.vis --never || true
          haxelib git flxanimate https://github.com/DotNoteOut/flxanimate --never || true
          haxelib git extension-androidtools https://github.com/Maysamks/extension-androidtools --never || true
          haxelib git extension-haptics https://github.com/crowplexus/extension-haptics --never || true
          haxelib git hxvlc https://github.com/MA39-dev/hxvlc --never || true
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit --never || true
          haxelib git extension-orientation https://github.com/HaxeExtension/extension-orientation --never || true
          haxelib list

      - name: Generar KeyStore si no existe
        run: |
          if [ ! -f key.keystore ]; then
            keytool -genkey -v -keystore key.keystore -alias pslice -keyalg RSA -keysize 2048 -validity 10000 -storepass pslice -keypass pslice -dname "CN=StivenEngine, OU=Dev, O=Stiven, L=City, S=State, C=US"
          fi

      - name: Configurar Lime para Android
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"

      - name: Compilar APK (Release)
        run: |
          haxelib run lime build android -final -D officialBuild

      - name: Subir APK a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Stiven-Engine-APK
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
