name: Build Stiven Engine APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Haxe
        uses: kmdk/setup-haxe@v1
        with:
          haxe-version: 4.3.3

      - name: Configurar Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Instalar Librerías Haxe
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.0.1
          haxelib install openfl 9.2.1
          haxelib install flixel 5.5.0
          haxelib install flixel-addons 3.3.2
          haxelib install flixel-ui 2.5.0
          haxelib install flxanimate
          haxelib install hscript-iris 1.1.3
          haxelib install tjson 1.4.0
          haxelib install grig.audio
          haxelib install funkin.vis
          haxelib install extension-androidtools
          haxelib install extension-haptics
          haxelib install hxvlc
          haxelib install linc_luajit
          haxelib install extension-firebase-crashlytics
          haxelib list

      - name: Generar KeyStore si no existe
        run: |
          if [ ! -f key.keystore ]; then
            keytool -genkey -v -keystore key.keystore -alias pslice -keyalg RSA -keysize 2048 -validity 10000 -storepass pslice -keypass pslice -dname "CN=StivenEngine, OU=Dev, O=Stiven, L=City, S=State, C=US"
          fi

      - name: Configurar Lime para Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Compilar APK (Release)
        run: |
          haxelib run lime build android -final

      - name: Subir APK a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Stiven-Engine-APK
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
