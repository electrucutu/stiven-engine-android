name: Build Stiven Engine APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Aumentar Memoria SWAP
        run: |
          sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=8192 status=none
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          free -h

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Acomodar archivos del proyecto
        run: |
          if [ ! -f "Project.xml" ] && [ ! -f "project.xml" ]; then
            echo "Buscando Project.xml en subcarpetas..."
            XML_PATH=$(find . -maxdepth 3 -iname "project.xml" | head -n 1)
            if [ -n "$XML_PATH" ]; then
              DIR=$(dirname "$XML_PATH")
              echo "Moviendo archivos desde $DIR a la raíz..."
              cp -r "$DIR"/* . 2>/dev/null || true
              cp -r "$DIR"/.* . 2>/dev/null || true
            fi
          fi
          ls -la

      - name: Instalar NekoVM, Haxe y Herramientas C++
        run: |
          sudo apt-get update
          sudo apt-get install -y neko libneko2 build-essential gcc-multilib g++-multilib unzip
          wget -q https://github.com/HaxeFoundation/haxe/releases/download/4.3.3/haxe-4.3.3-linux64.tar.gz
          mkdir haxe-dist
          tar -xzf haxe-4.3.3-linux64.tar.gz -C haxe-dist --strip-components=1
          sudo cp -r haxe-dist/* /usr/local/bin/
          sudo chmod +x /usr/local/bin/haxe /usr/local/bin/haxelib
          haxe -version

      - name: Configurar Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Instalar Librerías Haxe
        run: |
          haxelib setup ~/haxelib

          echo "Instalando dependencias base..."
          haxelib install lime 8.0.1 --never > /dev/null 2>&1
          haxelib run lime setup -y > /dev/null 2>&1
          haxelib install openfl 9.2.1 --never > /dev/null 2>&1
          haxelib install flixel 5.5.0 --never > /dev/null 2>&1
          haxelib install flixel-addons 3.3.2 --never > /dev/null 2>&1
          haxelib install flixel-ui 2.5.0 --never > /dev/null 2>&1
          haxelib install tjson 1.4.0 --never > /dev/null 2>&1 || true
          haxelib install grig.audio --never > /dev/null 2>&1 || true

          install_zip_lib() {
            NAME=$1
            REPO_URL=$2
            echo "Descargando $NAME por HTTP..."
            TARGET_DIR="$HOME/haxelib/$NAME/git"
            rm -rf "$HOME/haxelib/$NAME"
            mkdir -p "$TARGET_DIR"
            
            TMP_ZIP="/tmp/${NAME}.zip"
            rm -f "$TMP_ZIP"
            
            # Intentar primero con la rama main
            curl -sL "${REPO_URL}/archive/refs/heads/main.zip" -o "$TMP_ZIP"
            if ! unzip -tq "$TMP_ZIP" > /dev/null 2>&1; then
              # Si falla, intentar con master
              curl -sL "${REPO_URL}/archive/refs/heads/master.zip" -o "$TMP_ZIP"
            fi
            
            unzip -q -o "$TMP_ZIP" -d "/tmp/extract_${NAME}"
            EXTRACTED_PATH=$(find "/tmp/extract_${NAME}" -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$EXTRACTED_PATH" ]; then
              cp -r "$EXTRACTED_PATH"/* "$TARGET_DIR/"
              cp -r "$EXTRACTED_PATH"/.* "$TARGET_DIR/" 2>/dev/null || true
            fi
            echo "git" > "$HOME/haxelib/$NAME/.current"
            rm -rf "/tmp/extract_${NAME}" "$TMP_ZIP"
          }

          install_zip_lib hscript-iris https://github.com/CrowPlexus/hscript-iris
          install_zip_lib funkin.vis https://github.com/FunkinCrew/funkin.vis
          install_zip_lib extension-haptics https://github.com/crowplexus/extension-haptics
          install_zip_lib extension-androidtools https://github.com/Maysamks/extension-androidtools
          install_zip_lib extension-firebase-crashlytics https://github.com/MasterForge/extension-firebase-crashlytics
          install_zip_lib flxanimate https://github.com/DotNoteOut/flxanimate
          install_zip_lib hxvlc https://github.com/MA39-dev/hxvlc
          install_zip_lib linc_luajit https://github.com/superpowers04/linc_luajit
          install_zip_lib extension-orientation https://github.com/HaxeExtension/extension-orientation

          echo "--- LIBRERIAS CONFIGURADAS ---"
          haxelib list

      - name: Generar KeyStore si no existe
        run: |
          if [ ! -f key.keystore ]; then
            keytool -genkey -v -keystore key.keystore -alias pslice -keyalg RSA -keysize 2048 -validity 10000 -storepass pslice -keypass pslice -dname "CN=StivenEngine, OU=Dev, O=Stiven, L=City, S=State, C=US"
          fi

      - name: Configurar Lime para Android
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"

      - name: Compilar APK (Release)
        run: |
          export HXCPP_COMPILE_THREADS=1
          haxelib run lime build android -final -D officialBuild

      - name: Subir APK a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Stiven-Engine-APK
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
